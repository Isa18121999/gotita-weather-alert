AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GÓTITA backend (API Gateway + Lambda) para frontend alojado en Render.

Parameters:
  KafkaRestBaseUrl:
    Type: String
    Default: ''
    Description: Base URL de Kafka REST de Aiven, sin /topics al final.
  KafkaUsername:
    Type: String
    Default: ''
    Description: Usuario del servicio Kafka de Aiven.
  KafkaPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Contraseña del servicio Kafka de Aiven.
  AlertPublishToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Token secreto para autorizar la publicación de alertas en GÓTITA.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512
    Timeout: 30
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps

Resources:
  GotitaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type, x-gotita-alert-token]
        AllowOrigins: ['*']

  WeatherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/weather.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
      Events:
        Stations:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/weather/stations
            Method: GET
        Outlook:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/weather/outlook
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/weather.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  OfficialSourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/fuentes-oficiales.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
      Events:
        Sources:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/fuentes-oficiales
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/fuentes-oficiales.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  IndeciFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/indeci.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
      Events:
        Emergencies:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/indeci/emergencias
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/indeci.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  EnfenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/enfen.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
      Events:
        Communiques:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/enfen/comunicados
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/enfen.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  NoticiasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/noticias.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
      Events:
        News:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/noticias
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/noticias.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  AlertasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/alertas.handler
      Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
      Environment:
        Variables:
          KAFKA_REST_BASE_URL: !Ref KafkaRestBaseUrl
          KAFKA_USERNAME: !Ref KafkaUsername
          KAFKA_PASSWORD: !Ref KafkaPassword
          KAFKA_TOPIC: gotita-alertas
          ALERT_PUBLISH_TOKEN: !Ref AlertPublishToken
      Events:
        PublishAlert:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/alertas
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/alertas.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

Outputs:
  ApiUrl:
    Description: Endpoint HTTP API para el frontend alojado en Render
    Value: !Sub 'https://${GotitaApi}.execute-api.${AWS::Region}.amazonaws.com'
