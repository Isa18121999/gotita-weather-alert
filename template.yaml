AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GÓTITA - plataforma de alerta temprana de lluvias en Peru. Arquitectura compatible con AWS Academy Learner Lab usando S3 privado + API Gateway + Lambda.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512
    Timeout: 30
    Architectures:
      - x86_64
    Role: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole'
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps

  GotitaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [Content-Type]
        AllowOrigins: ['*']

  WeatherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/weather.handler
      Events:
        Stations:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/weather/stations
            Method: GET
        Outlook:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/weather/outlook
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/weather.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  OfficialSourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/fuentes-oficiales.handler
      Events:
        Sources:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/fuentes-oficiales
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/fuentes-oficiales.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  IndeciFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/indeci.handler
      Events:
        Emergencies:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/indeci/emergencias
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/indeci.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  EnfenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/enfen.handler
      Events:
        Communiques:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /api/enfen/comunicados
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/enfen.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: api/web.handler
      Environment:
        Variables:
          WEB_BUCKET: !Ref WebBucket
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: /
            Method: GET
        Static:
          Type: HttpApi
          Properties:
            ApiId: !Ref GotitaApi
            Path: '/{proxy+}'
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [api/web.ts]
        Format: esm
        Target: es2022
        Minify: true
        Sourcemap: true
        OutExtension: ['.js=.mjs']

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  WebsiteUrl:
    Description: URL publica de GÓTITA mediante API Gateway + Lambda
    Value: !Sub 'https://${GotitaApi}.execute-api.${AWS::Region}.amazonaws.com/'
  WebBucketName:
    Description: Bucket S3 privado donde se almacenan los archivos del frontend
    Value: !Ref WebBucket
  ApiUrl:
    Description: Endpoint HTTP API de GÓTITA
    Value: !Sub 'https://${GotitaApi}.execute-api.${AWS::Region}.amazonaws.com'
